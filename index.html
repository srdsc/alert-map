<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts AutoRefresh</title>
    <!-- Перезагрузка страницы целиком каждые 300 секунд (5 минут). 
         Если хотите изменить время, поменяйте число 300 на другое (в секундах) -->
    <meta http-equiv="refresh" content="300">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe src="https://alerts.in.ua"></iframe>
</body>
</html>
